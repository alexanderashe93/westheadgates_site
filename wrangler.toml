# Westhead Gates Ltd — Cloudflare deployment.
#
# public/ is uploaded as static assets and served from Cloudflare's edge.
# The Worker runs for one path only: the contact form. See README §8.

name = "westhead-gates"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# ---------------------------------------------------------------- the site
[assets]
directory = "public"
binding = "ASSETS"

# Serve /contact for /contact.html.
html_handling = "auto-trailing-slash"

# Unknown paths get the site's own 404 page.
not_found_handling = "404-page"

# Everything except the form is served straight off the edge without waking
# the Worker.
run_worker_first = ["/api/*"]

# ------------------------------------------------------------------- email
# A Worker has no mail server of its own, so the enquiry has to be handed to
# something that does.
#
# "cloudflare" uses Cloudflare's own Email Workers: no third-party account,
# no API key, no cost. To switch it on:
#
#   1. Cloudflare dashboard -> the domain -> Email -> Email Routing -> enable.
#   2. Add info@westhead-gates.co.uk as a destination address and click the
#      link in the verification email Cloudflare sends it.
#   3. Uncomment the [[send_email]] block below and deploy.
#
# Until step 2 is done the deploy will be rejected, which is why the block
# starts commented out. The alternatives are resend, sendgrid and mailgun —
# each needs the domain verified with them and a key:
#
#   npx wrangler secret put MAIL_API_KEY
#
# "log" prints the enquiry to the console instead of sending, for testing.
[vars]
MAIL_PROVIDER = "cloudflare"

# The list of addresses the Worker is allowed to email. Each one has to be a
# verified Email Routing destination on the domain, and that restriction is
# the point: the form can reach the business and nobody else, so it cannot be
# turned into an open relay.
# [[send_email]]
# name = "SEND_EMAIL"
# destination_address = "info@westhead-gates.co.uk"

# ------------------------------------------------------------- rate limits
# Holds one short-lived counter per visitor IP for the contact form's hourly
# limit. Create it, then paste the id it prints in below:
#
#   npx wrangler kv namespace create RATE
#
# Without this the form still works; it just isn't rate limited.
# [[kv_namespaces]]
# binding = "RATE"
# id = "PASTE_THE_ID_HERE"

[observability]
enabled = true
