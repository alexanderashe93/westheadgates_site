# Westhead Gates Ltd — Cloudflare deployment.
#
# public/ is uploaded as static assets and served from Cloudflare's edge.
# The Worker runs for one path only: the contact form. See README §8.

name = "westhead-gates"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# ---------------------------------------------------------------- the site
[assets]
directory = "public"
binding = "ASSETS"

# Serve /contact for /contact.html.
html_handling = "auto-trailing-slash"

# Unknown paths get the site's own 404 page.
not_found_handling = "404-page"

# Everything except the form is served straight off the edge without waking
# the Worker.
run_worker_first = ["/api/*"]

# ------------------------------------------------------------------- email
# A Worker has no mail server, so the enquiry goes out over HTTPS through a
# provider. Set its key once:
#
#   npx wrangler secret put MAIL_API_KEY
#
# Options: resend, sendgrid, mailgun, or log (prints to the console instead
# of sending, for local testing). Mailgun also needs MAILGUN_DOMAIN.
[vars]
MAIL_PROVIDER = "resend"

# ------------------------------------------------------------- rate limits
# Holds one short-lived counter per visitor IP for the contact form's hourly
# limit. Create it, then paste the id it prints in below:
#
#   npx wrangler kv namespace create RATE
#
# Without this the form still works; it just isn't rate limited.
# [[kv_namespaces]]
# binding = "RATE"
# id = "PASTE_THE_ID_HERE"

[observability]
enabled = true
