<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westhead Gates Ltd</title>
<meta name="description" content="Westhead Gates Ltd. Our website is currently under construction.">
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background: #1a1a1a;
    color: #e8e6e3;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    text-align: center;
  }
  main { width: 100%; max-width: 34rem; }
  img { display: block; width: 100%; max-width: 15rem; height: auto; margin: 0 auto 2rem; }
  h1 {
    margin: 0 0 1rem;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.75rem, 6vw, 2.4rem);
    line-height: 1.2;
    color: #ffffff;
  }
  p { margin: 0 0 1.25rem; text-wrap: balance; }
  .rule { width: 3.5rem; height: 3px; margin: 0 auto 1.5rem; background: #d9a227; border: 0; }
  a { color: #d9a227; font-weight: 600; text-underline-offset: .2em; word-break: break-word; }
  a:hover { color: #f0bd45; }
  a:focus-visible { outline: 3px solid #d9a227; outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/logo.svg" alt="" width="240" height="137">
  <h1>Westhead Gates Ltd</h1>
  <hr class="rule">
  <p>Our website is currently under construction. Please check back soon.</p>
  <p>Contact us: <a href="mailto:info@westhead-gates.co.uk">info@westhead-gates.co.uk</a></p>
</main>
</body>
</html>
